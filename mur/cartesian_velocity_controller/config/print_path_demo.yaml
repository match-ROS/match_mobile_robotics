# TCP path for mur620_whole_body_print_mvp.launch.
# Change the path geometry and path motion profile here.
#
# A fixed path origin is captured when the start service is called. At that
# instant mur620b/print_origin coincides with mur620b/base_link, then stays
# fixed in mur620b/odom for the rest of the path.
frame_id: "mur620b/print_origin"
waypoint_mode: "first_absolute_then_relative"
path_origin:
  enabled: true
  capture: "node_start"
  parent_frame: "mur620b/odom"
  source_frame: "mur620b/base_link"
  frame_id: "mur620b/print_origin"
  capture_timeout: 2.0

speed: 0.25
loop: false
max_linear_velocity: 0.40
max_linear_acceleration: 0.80
max_linear_jerk: 10.0
blend_tolerance: 0.08

# TCP local Z points downward relative to base_link Z-up.
orientation_rpy: [3.141592653589793, 0.0, 0.0]

waypoints:
  # First point: absolute in mur620b/print_origin.
  - position: [0.6, -0.8, 1.3]
  # Following points: offsets relative to the first point.
  - position: [0.00, 0.0, 0.0]
  - position: [0.60, 0.0, 0.0]
  - position: [2.20, 0.0, 0.0]
  - position: [4.20, -1.5, 0.0]
  - position: [6.20, -1.5, 0.0]
  
  # - position: [0.60, 0.0, 0.0]
  # - position: [0.90, -0.5, 0.0]
  # - position: [1.4, -0.8, 0.0]
  # - position: [2.0, -0.8, 0.0]

# Circular simulated obstacles for base avoidance.
# Coordinates use the same frame as the path. With relative_to_first_waypoint=true,
# position x/y are offsets from the first waypoint x/y; z remains absolute unless
# relative_z is set to true.
obstacles:
  enabled: true
  relative_to_first_waypoint: true
  relative_z: false
  marker_height: 0.12
  items:
    - name: "sim_obstacle_1"
      position: [3.20, -0.4, 0.0]
      radius: 0.10
  
