teleop_master_state_publisher:
  # PipelineDebug source topic (relative to this node namespace).
  # Typical (single-arm right): "cartesian_velocity_controller_r/pipeline_debug"
  # Typical (single-arm left):  "cartesian_velocity_controller_l/pipeline_debug"
  pipeline_debug_topic: cartesian_velocity_controller_r/pipeline_debug

  # Optional override; if empty, use msg.header.frame_id from PipelineDebug
  # In teleoperation we want the published target pose / twist to be expressed in the
  # SLAVE robot base frame (namespaced TF), so the slave controller can consume it
  # without requiring a TF connection between master and slave.
  # Example: "mur620_s/base_link"
  frame_id_override: "$(arg slave_ns)/base_link"

  # Output topics (relative to this node namespace).
  # In the default multi-robot workflow we run this node under the master robot
  # namespace (e.g. /mur620) so these become:
  #   /mur620/target_pose
  #   /mur620/feedforward_twist
  target_pose_topic: target_pose
  feedforward_twist_topic: feedforward_twist

