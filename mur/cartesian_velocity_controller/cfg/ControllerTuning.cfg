#!/usr/bin/env python
PACKAGE = "cartesian_velocity_controller"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# =========================
# Filter (Level C)
# =========================
filter_grp = gen.add_group("filter")
filter_grp.add("cartesian_filter_tau", double_t, 0,
               "Time constant tau for velocity filter", 0.1, 0.01, 1.0)
filter_grp.add("cartesian_linear_max_acceleration", double_t, 0,
               "Max linear acceleration (m/s^2)", 1.0, 0.0, 20.0)
filter_grp.add("cartesian_linear_max_jerk", double_t, 0,
               "Max linear jerk (m/s^3)", 10.0, 0.0, 200.0)
filter_grp.add("cartesian_angular_max_acceleration", double_t, 0,
               "Max angular acceleration (rad/s^2)", 2.0, 0.0, 50.0)
filter_grp.add("cartesian_angular_max_jerk", double_t, 0,
               "Max angular jerk (rad/s^3)", 20.0, 0.0, 200.0)
filter_grp.add("acceleration_scale_factor", double_t, 0,
               "Global scaling factor for acceleration and jerk (0.0 - 1.0)", 1.0, 0.0, 1.0)
filter_grp.add("reset_filter_on_target_change", bool_t, 0,
               "Reset velocity filter internal state when target changes", False)
filter_grp.add("cartesian_filter_uniform_scaling_enabled", bool_t, 0,
               "Cartesian filter: uniform scaling (true) vs per-axis clamp (false)", True)

# =========================
# Joint velocity filter (pre-safety, joint-space smoothness)
# =========================
joint_filter_grp = gen.add_group("joint_filter")
joint_filter_grp.add("joint_filter_enabled", bool_t, 0,
                     "Enable joint-space velocity filter (pre-safety)", False)
joint_filter_grp.add("joint_filter_tau", double_t, 0,
                     "Time constant tau for joint velocity filter", 0.1, 0.01, 1.0)
joint_filter_grp.add("joint_filter_uniform_scaling_enabled", bool_t, 0,
                     "Joint filter: uniform scaling (true) vs per-joint clamp (false)", False)
joint_filter_grp.add("joint_filter_max_acceleration_arm", double_t, 0,
                     "Max joint acceleration for joints 1-3 (rad/s^2)", 5.0, 0.0, 100.0)
joint_filter_grp.add("joint_filter_max_acceleration_wrist", double_t, 0,
                     "Max joint acceleration for joints 4-6 (rad/s^2)", 5.0, 0.0, 100.0)
joint_filter_grp.add("joint_filter_max_jerk_arm", double_t, 0,
                     "Max joint jerk for joints 1-3 (rad/s^3)", 50.0, 0.0, 500.0)
joint_filter_grp.add("joint_filter_max_jerk_wrist", double_t, 0,
                     "Max joint jerk for joints 4-6 (rad/s^3)", 50.0, 0.0, 500.0)

# =========================
# Pose filtering
# =========================
pose_grp = gen.add_group("pose_filter")
pose_grp.add("pose_filter_alpha", double_t, 0,
             "EMA alpha for TCP pose filter", 0.85, 0.0, 1.0)

# =========================
# Global planner (Level A)
# =========================
global_grp = gen.add_group("global_planner")
global_grp.add("waypoint_switch_distance", double_t, 0,
               "Distance threshold for waypoint switch (m)", 0.02, 0.001, 1.0)
global_grp.add("orientation_switch_threshold", double_t, 0,
               "Orientation threshold for waypoint switch (rad)", 0.05, 0.0, 3.2)

# =========================
# Local planner (Level B)
# =========================
local_grp = gen.add_group("local_planner")
local_grp.add("attractive_gain", double_t, 0,
              "Attractive gain", 2.0, 0.0, 15.0)
local_grp.add("max_linear_velocity", double_t, 0,
              "Max linear velocity (m/s)", 0.5, 0.0, 2.0)
local_grp.add("max_angular_velocity", double_t, 0,
              "Max angular velocity (rad/s)", 1.0, 0.0, 5.0)
local_grp.add("velocity_scale_factor", double_t, 0,
              "Global scaling factor for velocity (0.0 - 1.0)", 1.0, 0.0, 1.0)
local_grp.add("repulsive_enabled", bool_t, 0,
              "Enable repulsive components", True)
local_grp.add("repulsive_obstacle_gain", double_t, 0,
              "Repulsive gain for obstacles", 2.5, 0.0, 15.0)
local_grp.add("repulsive_link_gain", double_t, 0,
              "Repulsive gain for link POIs", 2.0, 0.0, 15.0)
local_grp.add("influence_distance", double_t, 0,
              "Repulsive influence distance (m)", 0.8, 0.01, 2.0)
local_grp.add("min_safe_distance", double_t, 0,
              "Minimum safe distance (m)", 0.1, 0.001, 0.5)

# Repulsive profile + smoothing (3.1, 3.3, 3.4)
# repulsive_velocity_profile:
# 0=LINEAR, 1=QUADRATIC, 2=SMOOTHSTEP, 3=SMOOTHERSTEP
local_grp.add("repulsive_velocity_profile", int_t, 0,
              "Repulsive velocity profile (0=LINEAR,1=QUADRATIC,2=SMOOTHSTEP,3=SMOOTHERSTEP)", 1, 0, 3)
local_grp.add("repulsive_filter_tau_rise", double_t, 0,
              "Repulsive EMA tau rise (s) - 0 disables", 0.0, 0.0, 1.0)
local_grp.add("repulsive_filter_tau_fall", double_t, 0,
              "Repulsive EMA tau fall (s) - 0 disables", 0.0, 0.0, 2.0)
local_grp.add("repulsive_max_acc_rise", double_t, 0,
              "Repulsive max acceleration rise (m/s^2) - 0 disables", 0.0, 0.0, 50.0)
local_grp.add("repulsive_max_acc_fall", double_t, 0,
              "Repulsive max acceleration fall (m/s^2) - 0 disables", 0.0, 0.0, 50.0)

# =========================
# Virtual Target Leash (Soft Leash)
# =========================
leash_grp = gen.add_group("virtual_target_leash")
leash_grp.add("leash_enabled", bool_t, 0,
              "Enable virtual target leash", True)
leash_grp.add("leash_start_distance", double_t, 0,
              "Distance where leash starts slowing down (m)", 0.10, 0.01, 0.5)
leash_grp.add("leash_stop_distance", double_t, 0,
              "Distance where virtual target stops (m)", 0.20, 0.02, 1.0)
leash_grp.add("leash_reset_threshold", double_t, 0,
              "Distance where hard reset is triggered (m)", 0.50, 0.1, 2.0)

# =========================
# PID Position (Level D)
# =========================
pid_pos = gen.add_group("pid_position")
pid_pos.add("pid_pos_kp", double_t, 0, "Position Kp", 2.0, 0.0, 10.0)
pid_pos.add("pid_pos_ki", double_t, 0, "Position Ki", 0.5, 0.0, 5.0)
pid_pos.add("pid_pos_kd", double_t, 0, "Position Kd", 0.0, 0.0, 5.0)
pid_pos.add("pid_pos_kff", double_t, 0, "Position feedforward gain", 0.8, 0.0, 2.0)
pid_pos.add("pid_pos_derivative_filter_tau", double_t, 0,
            "Position D filter tau (s)", 0.02, 0.0, 1.0)
pid_pos.add("pid_pos_deadband", double_t, 0,
            "Position deadband (m)", 0.0002, 0.0, 0.01)

# =========================
# PID Orientation (Level D)
# =========================
pid_ori = gen.add_group("pid_orientation")
pid_ori.add("pid_ori_kp", double_t, 0, "Orientation Kp", 1.5, 0.0, 10.0)
pid_ori.add("pid_ori_ki", double_t, 0, "Orientation Ki", 0.4, 0.0, 5.0)
pid_ori.add("pid_ori_kd", double_t, 0, "Orientation Kd", 0.0, 0.0, 5.0)
pid_ori.add("pid_ori_kff", double_t, 0, "Orientation feedforward gain", 0.8, 0.0, 2.0)
pid_ori.add("pid_ori_derivative_filter_tau", double_t, 0,
            "Orientation D filter tau (s)", 0.02, 0.0, 1.0)
pid_ori.add("pid_ori_deadband", double_t, 0,
            "Orientation deadband (rad)", 0.001, 0.0, 0.1)

# =========================
# Joint safety limiter
# =========================
safety_grp = gen.add_group("safety")
safety_grp.add("max_joint_velocity", double_t, 0,
               "Uniform joint velocity limit (rad/s)", 1.0, 0.0, 10.0)
safety_grp.add("max_joint_acceleration", double_t, 0,
               "Uniform joint acceleration limit (rad/s^2)", 5.0, 0.0, 50.0)

# =========================
# Jacobian solver
# =========================
jacobian_grp = gen.add_group("jacobian")
jacobian_grp.add("singularity_threshold", double_t, 0,
                 "Singularity threshold", 0.05, 0.0, 1.0)
jacobian_grp.add("max_damping", double_t, 0,
                 "Max damping near singularity", 0.3, 0.0, 5.0)

# =========================
# Repulsive POI Configuration
# =========================
poi_grp = gen.add_group("repulsive_pois")

# TCP POI (special - generates ObstacleInfo for direct TCP repulsion)
poi_grp.add("poi_tcp_enabled", bool_t, 0, "Enable TCP repulsion point", True)
poi_grp.add("poi_tcp_weight", double_t, 0, "TCP repulsion weight", 1.0, 0.0, 2.0)
poi_grp.add("poi_tcp_radius", double_t, 0, "TCP influence radius (m)", 0.08, 0.0, 0.5)

# Elbow POI
poi_grp.add("poi_elbow_enabled", bool_t, 0, "Enable elbow repulsion point", False)
poi_grp.add("poi_elbow_weight", double_t, 0, "Elbow repulsion weight", 1.0, 0.0, 2.0)
poi_grp.add("poi_elbow_radius", double_t, 0, "Elbow influence radius (m)", 0.05, 0.0, 0.5)

# Wrist POI
poi_grp.add("poi_wrist_enabled", bool_t, 0, "Enable wrist repulsion point", True)
poi_grp.add("poi_wrist_weight", double_t, 0, "Wrist repulsion weight", 1.0, 0.0, 2.0)
poi_grp.add("poi_wrist_radius", double_t, 0, "Wrist influence radius (m)", 0.08, 0.0, 0.5)

# Forearm POI
poi_grp.add("poi_forearm_enabled", bool_t, 0, "Enable forearm repulsion point", False)
poi_grp.add("poi_forearm_weight", double_t, 0, "Forearm repulsion weight", 0.8, 0.0, 2.0)
poi_grp.add("poi_forearm_radius", double_t, 0, "Forearm influence radius (m)", 0.03, 0.0, 0.5)

# Repulsion map query smoothing/prediction (3.6, 3.7)
repulsion_dbg_grp = gen.add_group("repulsion_map")
repulsion_dbg_grp.add("gradient_filter_alpha", double_t, 0,
                      "EMA alpha for map gradient direction (0 disables)", 0.0, 0.0, 1.0)
repulsion_dbg_grp.add("poi_predict_enable", bool_t, 0,
                      "Enable predictive query for POIs (conservative)", False)
repulsion_dbg_grp.add("poi_predict_horizon", double_t, 0,
                      "Prediction horizon for POIs (s). If 0 uses map period.", 0.06, 0.0, 0.2)
repulsion_dbg_grp.add("poi_velocity_filter_tau", double_t, 0,
                      "EMA tau for POI velocity estimation (s). 0 disables.", 0.05, 0.0, 1.0)
repulsion_dbg_grp.add("poi_velocity_max", double_t, 0,
                      "Clamp POI velocity magnitude (m/s). 0 disables.", 1.5, 0.0, 5.0)
repulsion_dbg_grp.add("poi_predict_conservative_min_distance", bool_t, 0,
                      "Conservative distance: use min(d_now, d_pred)", True)

# =========================
# Singularity Avoidance (Joint Weights)
# =========================
sing_grp = gen.add_group("singularity_avoidance")
sing_grp.add("singularity_avoidance_buffer", double_t, 0,
             "Elbow singularity buffer (rad)", 0.2, 0.01, 1.0)
sing_grp.add("singularity_avoidance_weight", double_t, 0,
             "Max weight penalty for elbow singularity", 50.0, 1.0, 1000.0)

# =========================
# Elbow Injection (anti-singularity push)
# =========================
elbow_inj_grp = gen.add_group("elbow_injection")
elbow_inj_grp.add("elbow_injection_critical_zone", double_t, 0,
                  "Critical zone near MAX limit (rad)", 0.30, 0.01, 1.0)
elbow_inj_grp.add("elbow_injection_target_near_limit_threshold", double_t, 0,
                  "Target gating threshold (rad)", 0.2, 0.0, 1.0)
elbow_inj_grp.add("elbow_injection_k", double_t, 0,
                  "Push profile gain k", 1.5, 0.1, 10.0)
elbow_inj_grp.add("elbow_injection_max_push_velocity", double_t, 0,
                  "Max push velocity (rad/s)", 0.20, 0.0, 1.0)

# =========================
# Map3D Debug Configuration
# =========================
map3d_grp = gen.add_group("map3d_debug")
map3d_grp.add("map3d_slice_z", double_t, 0,
              "Z coordinate of debug slice in map frame (m)", 1.0, 0.0, 3.0)

# =========================
# Elbow Runtime Guard (joint position guardrail)
# =========================
elbow_guard_grp = gen.add_group("elbow_runtime_guard")
elbow_guard_grp.add("elbow_joint_min", double_t, 0,
                    "Elbow joint minimum position limit (rad)", -2.9, -3.5, 0.5)
elbow_guard_grp.add("elbow_joint_max", double_t, 0,
                    "Elbow joint maximum position limit (rad)", -0.01, -3.5, 0.5)
elbow_guard_grp.add("elbow_guard_soft_zone", double_t, 0,
                    "Elbow guard soft braking zone (rad)", 0.18, 0.0, 1.0)
elbow_guard_grp.add("elbow_guard_margin", double_t, 0,
                    "Elbow guard hard margin (rad)", 0.03, 0.0, 0.5)
elbow_guard_grp.add("elbow_guard_reentry_velocity", double_t, 0,
                    "Elbow guard reentry velocity (rad/s)", 0.1, 0.0, 1.0)

exit(gen.generate(PACKAGE, "cartesian_velocity_controller", "ControllerTuning"))
