UR_arm_l:
  # kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  # kinematics_solver_search_resolution: 0.005
  # kinematics_solver_timeout: 0.005
  kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
  solve_type: Distance
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.005

UR_arm_r:
  # kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  # kinematics_solver_search_resolution: 0.005
  # kinematics_solver_timeout: 0.005
  kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
  solve_type: Distance
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.005

  #Speed: ritorna velocemente la prima soluzione valida trovata (tipicamente senza “consumare” tutto il timeout).
  #Distance: usa tutto il timeout e poi ritorna la soluzione “più vicina” al seed (minimizza l’errore/SSE rispetto al seed).
  #Manip1: usa tutto il timeout e ritorna una soluzione che massimizza una misura di “manipolabilità” (det(JJ^T)).
  #Manip2: usa tutto il timeout e ritorna una soluzione che migliora la condizione del Jacobiano (minimizza il condition number / rapporto tra singolari).
