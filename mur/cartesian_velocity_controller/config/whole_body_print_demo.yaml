start_paused: true

rates:
  # The arm controller runs independently at its own high control_rate.
  # This node only updates the moving TCP reference and slow subsystems.
  path: 30.0
  base: 20.0
  lifter: 10.0
  debug: 10.0

path:
  frame_id: "map"
  speed: 0.05
  loop: false
  # TCP local Z points downward relative to base_link Z-up.
  orientation_rpy: [3.141592653589793, 0.0, 0.0]
  points:
    - [0.45, -0.30, 0.85]
    - [0.50, -0.30, 0.85]

tracking:
  kp_position: 0.8
  # Zone allocation between base and arm.
  # Errors are computed on target_position expressed in base/base_frame.
  # Inside full_* the arm tracks the path target fully.
  # Outside start_* the arm target is held/limited and the base does coarse positioning.
  arm_full_x_error: 0.15
  arm_full_y_error: 0.12
  arm_start_x_error: 0.45
  arm_start_y_error: 0.35
  arm_far_scale: 0.0

solver:
  damping: 0.02
  task_weight_z: 0.7

base:
  enabled: true
  cmd_vel_topic: "cmd_vel"
  base_frame: "mur620b/base_link"
  # Desired path target position expressed in base_frame.
  # x is forward/backward, y is lateral left/right in the robot base frame.
  preferred_tcp_x: 0.65
  preferred_tcp_y: 0.0
  max_linear_velocity: 0.08
  max_angular_velocity: 0.25
  weight_linear: 4.0
  weight_angular: 2.0
  k_preferred_x: 0.25
  k_lateral: 0.6
  k_heading: 0.25
  allow_reverse: false
  align_to_path: true
  tf_timeout: 0.05
  target_filter_tau: 1.0

base_avoidance:
  enabled: false
  scan_topic: "mir/f_scan"
  scan_topics: ["mir/f_scan", "mir/scan"]
  influence_distance: 1.2
  stop_distance: 0.35
  slowdown_distance: 0.8
  lateral_window: 0.9
  front_min_x: 0.05
  k_omega: 0.8
  max_omega: 0.35
  filter_tau: 0.4
  stale_timeout: 0.5

lifter:
  enabled: false
  joint_name: "right_lift_joint"
  joint_state_topic: "joint_states"
  command_topic: "UR10_r/ewellix_tlt_node_r/command"
  min_position: 0.0
  max_position: 0.5
  max_velocity: 0.015
  weight: 8.0
  k_position: 0.5
