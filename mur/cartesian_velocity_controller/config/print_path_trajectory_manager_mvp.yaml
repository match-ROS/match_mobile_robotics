# TCP path trajectory manager configuration for mur620_print_path_mvp.launch.
# This file is NOT used by mur620_whole_body_print_mvp.launch.

path_file: "$(arg path_file)"

rate: 20.0
loop: false
start_paused: true
publish_target_pose: false
validate_waypoints: true
validation_timeout: 10.0

target_pose_topic: "cartesian_velocity_controller_$(arg controller_suffix)/target_pose"
target_state_topic: "cartesian_velocity_controller_$(arg controller_suffix)/target_state"

path_origin:
  capture: "node_start"

preposition:
  enabled: true
  require_start_reached: true
  position_tolerance: 0.05
  dwell_s: 1.0
  ee_state_topic: "cartesian_velocity_controller_$(arg controller_suffix)/end_effector_state"

base_control:
  enabled: true
  cmd_vel_topic: "cmd_vel"
  base_frame: "$(arg mur_ns)/base_link"
  preferred_tcp_x: 0.50
  preferred_tcp_y: -0.80
  max_linear_velocity: 0.8
  max_angular_velocity: 0.8
  # Conservative command ramp for MiR600-class base.
  # MiR600 nominal max linear acceleration is about 0.37 m/s^2 at full payload.
  max_linear_acceleration: 0.30
  max_angular_acceleration: 0.80
