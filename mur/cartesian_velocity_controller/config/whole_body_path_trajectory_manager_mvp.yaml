# Trajectory manager parameters for mur620_whole_body_print_mvp.launch.
# Change the runtime/topic behavior here.
# The TCP path itself is configured only in print_path_demo.yaml.

path_file: "$(arg path_file)"

rate: 30.0
start_paused: true
hold_final_pose: true
validate_waypoints: $(arg validate_waypoints)
validation_timeout: 10.0
publish_target_pose: false

target_pose_topic: "cartesian_velocity_controller_$(arg controller_suffix)/target_pose"
target_state_topic: "whole_body_print_controller/input_target_state"
validation_service: "cartesian_velocity_controller_$(arg controller_suffix)/validate_poses"

# For this launch the base is controlled only by whole_body_print_controller.
# Keep this disabled here: enabling it creates a second cmd_vel publisher on the
# same base topic and conflicts with the whole-body controller.
base_control:
  enabled: false
  base_frame: "$(arg mur_ns)/base_link"
  preferred_tcp_x: 0.50
  preferred_tcp_y: -0.80
  tf_timeout: 0.05

preposition:
  reached_mode: "base_target"
  base_target_tolerance: 0.25
  ee_state_topic: "cartesian_velocity_controller_$(arg controller_suffix)/end_effector_state"

tracking_guard:
  enabled: true
  slowdown_error: 0.03
  stop_error: 0.08
  resume_hysteresis: 0.05
