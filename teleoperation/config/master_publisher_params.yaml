teleop_master_state_publisher:
  # PipelineDebug source topic (relative to this node namespace).
  # Typical (single-arm right): "cartesian_velocity_controller_r/pipeline_debug"
  # Typical (single-arm left):  "cartesian_velocity_controller_l/pipeline_debug"
  pipeline_debug_topic: cartesian_velocity_controller_r/pipeline_debug

  # Optional override; if empty, use msg.header.frame_id from PipelineDebug
  frame_id_override: ""

  target_pose_topic: target_pose_teleop
  feedforward_twist_topic: feedforward_twist_teleop

