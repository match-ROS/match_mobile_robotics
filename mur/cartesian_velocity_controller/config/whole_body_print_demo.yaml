# Whole-body controller parameters for mur620_whole_body_print_mvp.launch.
# Change the mobile-base behavior here.
# The TCP path is loaded separately from print_path_demo.yaml under ~path_spec.

start_paused: true

target_pose_topic: "cartesian_velocity_controller_$(arg controller_suffix)/target_pose"
publish_target_pose: false
publish_target_state: true
arm_target_state_topic: "cartesian_velocity_controller_$(arg controller_suffix)/target_state"
target_state_input:
  enabled: false
  topic: "whole_body_print_controller/input_target_state"
ee_state_topic: "cartesian_velocity_controller_$(arg controller_suffix)/end_effector_state"

preposition:
  enabled: true
  # Delay after /resume before the base starts prepositioning. Useful for video recording.
  resume_delay_s: 12.0
  reached_mode: "tcp"
  base_target_tolerance: 0.25
  position_tolerance: 0.05
  dwell_s: 0.0

rates:
  # The arm controller runs independently at its own high control_rate.
  # This node only updates the moving TCP reference and the slow subsystems.
  path: 30.0
  base: 25.0
  lifter: 10.0
  debug: 10.0
  path_marker: 30.0

tracking:
  kp_position: 0.8
  # Zone allocation between base and arm.
  # Errors are computed on target_position expressed in base/base_frame.
  # Inside full_* the arm tracks the path target fully.
  # Outside start_* the arm target is held/limited and the base does coarse positioning.
  arm_full_x_error: 0.20
  arm_full_y_error: 0.20
  arm_start_x_error: 0.35
  arm_start_y_error: 0.35
  arm_far_scale: 1.0
  arm_gate_only_preposition: true
  # Prevent the time-based path reference from running away if the real robot lags.
  # Set any of these to 0.0 to disable that specific guard.
  max_tcp_error_for_progress: 0.20
  max_base_x_error_for_progress: 0.75
  max_base_y_error_for_progress: 0.45

solver:
  damping: 0.02
  task_weight_z: 0.7

base:
  enabled: true
  cmd_vel_topic: "cmd_vel"
  base_frame: "$(arg mur_ns)/base_link"
  # Desired path target position expressed in base_frame.
  # x is forward/backward, y is lateral left/right in the robot base frame.
  preferred_tcp_x: 0.25
  #preferred_tcp_y: -0.75
  preferred_tcp_y: -1.0
  max_linear_velocity: 0.5
  max_angular_velocity: 0.8
  # Conservative command ramp for MiR600-class base.
  # MiR600 nominal max linear acceleration is about 0.37 m/s^2 at full payload.
  max_linear_acceleration: 0.30
  max_angular_acceleration: 0.80
  weight_linear: 4.0
  weight_angular: 2.0
  k_preferred_x: 0.8
  k_lateral: 0.8
  k_heading: 0.8
  allow_reverse: true
  align_to_path: true
  tf_timeout: 0.05
  target_filter_tau: 0.5

base_compensation:
  # Feed-forward used by the arm to compensate base motion.
  # The commanded term is the final cmd_vel after acceleration limiting and avoidance.
  enabled: true
  odom_topic: "mobile_base_controller/odom"
  # 0.0 = use only commanded velocity after avoidance.
  # 1.0 = use only odometry velocity. Intermediate values blend both in base_frame.
  odom_weight: 0.0
  odom_timeout: 0.25

base_avoidance:
  enabled: true
  use_laser_scans: false
  scan_topic: "mir/f_scan"
  scan_topics: ["mir/f_scan", "mir/scan"]
  # radial: circular sectors; longitudinal/rectangular: front x-distance;
  # rounded_front/front_arc: rectangular sides with a circular front arc through the front corners.
  distance_mode: "rounded_front"
  influence_distance: 1.2
  stop_distance: 0.7
  slowdown_distance: 0.8
  lateral_window: 0.9
  influence_lateral_window: 0.9
  slowdown_lateral_window: 0.5
  stop_lateral_window: 0.4
  front_min_x: -0.20
  k_omega: 0.8
  max_omega: 0.25
  filter_tau: 0.3
  stale_timeout: 0.5
  perimeter_marker_rate: 10.0

lifter:
  enabled: false
  joint_name: "$(arg lifter_joint)"
  joint_state_topic: "joint_states"
  command_topic: "$(arg lifter_command_topic)"
  min_position: 0.0
  max_position: 0.5
  max_velocity: 0.015
  weight: 8.0
  k_position: 0.5
