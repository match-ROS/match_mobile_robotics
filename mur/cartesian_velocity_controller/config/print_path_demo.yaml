# TCP path for mur620_whole_body_print_mvp.launch.
# Change the path geometry and path motion profile here.
#
# A fixed path origin is captured when the start service is called. At that
# instant mur620b/print_origin coincides with mur620b/base_link, then stays
# fixed in mur620b/odom for the rest of the path.
frame_id: "mur620b/print_origin"
# Supported waypoint modes:
# - absolute: every point is expressed in frame_id.
# - first_absolute_then_relative: first point absolute; following values are
#   offsets from the first point, expressed in the same axes as frame_id.
# - first_absolute_then_incremental: first point absolute; following values are
#   deltas from the previous resolved point, expressed in the same axes as frame_id.
waypoint_mode: "first_absolute_then_incremental"
path_origin:
  enabled: true
  capture: "node_start"
  parent_frame: "mur620b/odom"
  source_frame: "mur620b/base_link"
  frame_id: "mur620b/print_origin"
  capture_timeout: 2.0

speed: 0.25
loop: false
max_linear_velocity: 0.40
max_linear_acceleration: 0.80
max_linear_jerk: 10.0
# Radius used to round sharp corners between consecutive path segments.
# Set to 0.0 to keep exact angular waypoints.
corner_radius: 0.2
blend_tolerance: 0.03
# Default internal sampling distance for circular arcs. Smaller values produce
# smoother arcs and rounded corners with more generated points.
arc_max_step: 0.05

# TCP local Z points downward relative to base_link Z-up.
orientation_rpy: [3.141592653589793, 0.0, 0.0]

waypoints:
  # First point: absolute in mur620b/print_origin.
  - position: [0.6, -1.0, 1.3]
  # With waypoint_mode=first_absolute_then_relative, following points are offsets
  # relative to the first point. With first_absolute_then_incremental, they are
  # segment deltas from the previous resolved point.
  # - position: [0.00, 0.0, 0.0]
  # - position: [0.60, 0.0, 0.0]
  # - position: [2.20, 0.0, 0.0]
  # - position: [4.20, -1.5, 0.0]
  # - position: [6.20, -1.5, 0.0]


  # - position: [0.00, 0.0, 0.0]
  # - position: [2.0, 0.0, 0.0]
  # - arc:
  #     end: [0.80, -3.50, 0.0]
  #     radius: 2.0
  #     side: left
  #     max_step: 0.05

  - position: [0.00, 0.0, 0.0]
  - position: [2.0, 0.0, 0.0]
  - arc:
      end: [1.50, 4.50, 0.0]
      radius: 3.0
      side: right
      max_step: 0.05


  # Circular arc segment. It starts at the previous point and ends at "end".
  # "end" and "center" use the same convention as position for the selected
  # waypoint_mode.
  # "side" is the side where the arc bulges while moving from previous point
  # to end. Swap left/right to get the opposite concave/convex arc.
  #
  # - arc:
  #     end: [6.80, -0.90, 0.0]
  #     radius: 0.80
  #     side: left
  #     max_step: 0.05
  #
  # Alternative: define the circle center directly instead of radius+side.
  # - arc:
  #     end: [6.80, -0.90, 0.0]
  #     center: [6.80, -1.50, 0.0]
  #     direction: cw
  
  # - position: [0.60, 0.0, 0.0]
  # - position: [0.90, -0.5, 0.0]
  # - position: [1.4, -0.8, 0.0]
  # - position: [2.0, -0.8, 0.0]

# Circular simulated obstacles for base avoidance.
# Coordinates use the same frame as the path. With relative_to_first_waypoint=true,
# position x/y are offsets from the first waypoint x/y; z remains absolute unless
# relative_z is set to true.
obstacles:
  enabled: true
  relative_to_first_waypoint: true
  relative_z: false
  marker_height: 0.12
  items:
    - name: "sim_obstacle_1"
      position: [3.10, 1.4, 0.0]
      radius: 0.10
  
