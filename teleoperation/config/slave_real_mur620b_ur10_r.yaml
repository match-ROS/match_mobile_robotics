## Teleoperation SLAVE outer-loop config for real MUR620b + UR10e right arm.
## This YAML is loaded inside the node private namespace (rosparam in <node>), so keys become:
##   /teleop_slave_twist_outer_loop/<key>
##
## NOTE (master_slave_mur620b_real.launch):
## - In that launch file, the “wiring” keys (frames + topics + wrench TF mode) are overwritten via <param ...>
##   AFTER this YAML is loaded, to keep this YAML reusable across robot namespaces.

## ----------------------------
## TF frames (full TF ids)
## ----------------------------
# **base_frame**: reference frame in which the controller runs (twist is expressed here, wrench is rotated here).
base_frame: mur620b/UR10_r/base_link_inertia

# **tcp_frame**: tool/TCP frame of the slave arm (used to compute pose error).
tcp_frame: mur620b/UR10_r/tool0

## ----------------------------
## I/O wiring (topics)
## ----------------------------
# **target_pose_topic**: PoseStamped target coming from master (or another planner).
target_pose_topic: /teleop/mur620b/target_pose

# **feedforward_twist_topic**: TwistStamped feedforward term from master (optional but typically enabled).
feedforward_twist_topic: /teleop/mur620b/feedforward_twist

# **wrench_topic**: measured FT wrench on the slave arm (WrenchStamped).
wrench_topic: /mur620b/UR10_r/wrench

# **command_topic**: where we publish the final commanded twist (Twist).
command_topic: /mur620b/UR10_r/twist_controller/command_collision_free

## ----------------------------
## Loop & timeouts
## ----------------------------
# **control_rate**: controller update frequency (Hz).
control_rate: 250.0

# **tf_timeout_s**: TF lookup timeout (s). Keep small; failure skips that sample.
tf_timeout_s: 0.02

# These are “data freshness” timeouts (s). If stale, the node will typically stop/hold safe behavior.
target_pose_timeout: 0.1
feedforward_timeout: 0.1
wrench_timeout: 0.1

## ----------------------------
## Core control: feedforward + compliance
## ----------------------------
# **k_ff**: feedforward dominance (1.0 = pure feedforward, 0 = ignore feedforward).
k_ff: 1.0

## Compliance term:
##   v_comp = -k_adm * F
## where F is the measured force (and optionally torque if enabled).
## Start conservative for real hardware.
k_adm_linear: 0.0012
k_adm_angular: 0.0

# **use_torques**: if true, use torque component for angular compliance (requires sensible k_adm_angular).
use_torques: false

## ----------------------------
## Force-aware scaling alpha(F)
## ----------------------------
# This scales motion down when contact force grows.
# - **alpha_mode=parallel**: scale only the component parallel to the measured force direction.
# - **alpha_mode=norm**: scale the whole vector based on force norm.
alpha_mode: parallel   # "parallel" or "norm"
force_start: 8.0       # N
force_stop: 30.0       # N

## ----------------------------
## Wrench TF options (frame alignment)
## ----------------------------
# Like the master: rotate the incoming wrench into base_frame using TF.
# If the incoming WrenchStamped.header.frame_id is not valid in TF, set:
# - **wrench_source_frame_override** to a valid frame (usually the TCP).
wrench_source_frame_override: mur620b/UR10_r/tool0

# **use_latest_tf_for_wrench**:
# - true: use latest TF (time=0), robust when stamps are off
# - false: use message time
use_latest_tf_for_wrench: true

## ----------------------------
## Wrench filtering / deadband / clamps
## ----------------------------
# **wrench_filter_cutoff_hz** (preferred): low-pass cutoff (Hz). If > 0 it overrides `wrench_filter_alpha`.
# Match this with the master side if you want consistent “feel” in filtering.
wrench_filter_cutoff_hz: 30.0
#
# **wrench_filter_alpha**: 1st-order IIR smoothing on wrench (0..1). Used when cutoff_hz <= 0.
wrench_filter_alpha: 0.07

# Soft deadband on norms (N / Nm).
force_deadband: 1.0            # legacy fallback if enter/exit not set
force_deadband_enter: 1.0
force_deadband_exit: 0.7

torque_deadband: 0.2           # legacy fallback
torque_deadband_enter: 0.2
torque_deadband_exit: 0.14

# Saturation of wrench norms (safety).
max_force: 80.0
max_torque: 10.0

# Optional debug topic of filtered wrench.
publish_filtered_wrench_debug: false
filtered_wrench_topic: /teleop_debug/mur620b_UR10_r/slave_wrench_filtered

## ----------------------------
## Velocity limits (safety)
## ----------------------------
# Keep conservative for first tests.
max_linear_speed: 0.2
max_angular_speed: 0.4

# Separate caps for the compliance term only (prevents the admittance from “running away”).
max_compliance_linear_speed: 0.1
max_compliance_angular_speed: 0.2

## ----------------------------
## Hard guard (extra safety)
## ----------------------------
# If force exceeds threshold continuously for duration, trigger action.
hard_force_threshold: 20.0   # N
hard_force_duration: 0.03    # s
hard_guard_action: stop      # "stop" or "retreat"
retreat_speed: 0.03          # m/s (if retreat)

## ----------------------------
## dt sanitization (real-time robustness)
## ----------------------------
# Clamp dt relative to nominal (1/control_rate).
dt_min_factor: 0.5
dt_max_factor: 2.0
dt_use_substepping: true
dt_max_substeps: 10

## ----------------------------
## Spring control (replaces PID for bilateral teleoperation)
## ----------------------------
# When use_spring_control: true, the slave uses:
#   v = k_ff * v_master + K_s * e_p + Ki * integral(e_p) - k_adm * F_s
# The integral freezes when external force exceeds integral_force_freeze,
# preventing windup during contact.
use_spring_control: true
spring_stiffness_linear: 2.0       # 1/s (velocity = K_s * position_error)
spring_stiffness_angular: 1.5      # 1/s
spring_ki_linear: 0.3              # 1/s² (integral gain)
spring_ki_angular: 0.2
integral_max_linear: 0.05          # m·s (clamp on integral norm)
integral_max_angular: 0.1          # rad·s
integral_force_freeze: 2.0         # N — freeze integral when |F| > threshold
max_spring_linear_speed: 0.15      # m/s (spring output clamp)
max_spring_angular_speed: 0.3      # rad/s

## ----------------------------
## Master feedback publishing (reverse of master→slave)
## ----------------------------
# The slave publishes its actual TCP pose so the master can compute
# the virtual spring coupling force.
publish_master_feedback: true
master_feedback_pose_topic: /teleop/mur620b/slave_actual_pose
master_feedback_frame_override: mur620b/UR10_l/base_link_inertia
master_feedback_publish_rate: 250.0

## ----------------------------
## Legacy PID (used when use_spring_control: false)
## ----------------------------
pid:
  position:
    kp: 0.5
    ki: 0.8
    kd: 0.0
    output_limit: 0.05
    derivative_filter_tau: 0.02
  orientation:
    kp: 0.5
    ki: 0.8
    kd: 0.0
    output_limit: 0.15
    derivative_filter_tau: 0.02

