## Teleoperation MASTER (haptic/admittance) config for real MUR620b + UR10e left arm.
## This YAML is loaded inside the node private namespace (rosparam in <node>), so keys become:
##   /teleop_master_haptic_controller/<key>
##
## NOTE (master_slave_mur620b_real.launch):
## - In that launch file, several of these keys are overwritten via <param ...> AFTER this YAML is loaded.
##   (See launch for the authoritative runtime wiring.)

## ----------------------------
## I/O wiring (topics)
## ----------------------------
# **master_wrench_topic**: where we read the MASTER wrench (force/torque) measurement (geometry_msgs/WrenchStamped).
master_wrench_topic: /mur620b/UR10_l/wrench

# **slave_wrench_topic**: optional wrench fed back for force-reflection.
# - Empty string disables force reflection (safer for first tests).
# - If enabled, set e.g. "/mur620b/UR10_r/wrench".
slave_wrench_topic: "/mur620b/UR10_r/wrench"

# **coupling_wrench_topic**: optional additional wrench source (e.g. bimanual coupling). Usually empty.
coupling_wrench_topic: ""

## ----------------------------
## Wrench TF handling (frame alignment)
## ----------------------------
# The node rotates the incoming wrench into **wrench_target_frame** using TF.
# Many real load-cells publish with a header.frame_id that may be missing / wrong in TF; in that case:
#
# **wrench_source_frame_override**:
# - If non-empty, the node ignores msg->header.frame_id and uses this TF frame as the wrench "source".
# - Typical value: the tool frame (TCP) of the arm that carries the FT sensor.
wrench_source_frame_override: mur620b/UR10_l/tool0

# **use_latest_tf_for_wrench**:
# - true: use TF at time=0 (latest), more robust when stamps are not synchronized.
# - false: use the message stamp (or now if stamp is zero).
use_latest_tf_for_wrench: true

# **wrench_target_frame**: frame in which the wrench is expressed internally (often base inertia frame).
wrench_target_frame: mur620b/UR10_l/base_link_inertia

# **tf_timeout_s**: TF lookup timeout (s). Keep small; failure just skips that sample.
tf_timeout_s: 0.02

## ----------------------------
## Output command
## ----------------------------
# **command_topic**: where the node publishes the master twist command (geometry_msgs/Twist).
command_topic: /mur620b/UR10_l/twist_controller/command_collision_free

# **control_rate**: control loop frequency (Hz).
control_rate: 250.0

## ----------------------------
## Admittance / haptic dynamics
## ----------------------------
# The master side implements a (virtual) mass-damper admittance driven by measured wrench.
# Start conservative on real hardware.
#
# **mass_linear / damping_linear**: translational virtual dynamics.
mass_linear: 5.0
damping_linear: 10.0
#
# **mass_angular / damping_angular**: rotational virtual dynamics.
mass_angular: 0.005
damping_angular: 0.0005
#
# -----------------------------
# Feeling rotazionale "coerente" con la traslazione (formule guida)
# -----------------------------
# Per confrontare/accordare grandezze lineari (m, N) e angolari (rad, N·m) usa un
# "braccio equivalente" L [m] (ordine tipico 0.10–0.30 m, tipo raggio/lever arm percepito al TCP):
#
# - Spostamento equivalente:     x_eq = L * theta            [m]     (theta in rad)
# - Forza equivalente:           F_eq = tau / L              [N]     (tau in N·m)
#
# Da cui discendono regole pratiche per parametri "che sembrino uguali" all'operatore:
#
# - Limiti velocità:             omega_max ≈ v_max / L       [rad/s]
# - Deadband:                    tau_db    ≈ F_db * L        [N·m]
# - Clamp:                       tau_max   ≈ F_max * L       [N·m]
#
# E se vuoi una dinamica di ammettenza percepita simile (stessa "inerzia"):
#
# - Inerzia angolare:            J ≈ m * L^2                 [kg·m^2]
#   quindi:                      mass_angular   ≈ mass_linear   * L^2
# - Smorzamento angolare:        D_w ≈ D_v * L^2              [N·m·s/rad]
#   quindi:                      damping_angular ≈ damping_linear * L^2
#
# Nota: queste sono equivalenze di scala/feeling (non una garanzia di stabilità); vanno
# poi verificate con saturazioni, filtri e soglie di sicurezza.

## ----------------------------
## Dynamic damping (scheduled by slave force)
## ----------------------------
# Increase the master damping smoothly as the SLAVE measured force grows.
# Implementation lives inside `teleop_master_haptic_controller` and uses the already-subscribed slave wrench.
dynamic_damping:
  enabled: false  
  use_slave_wrench: true
  force_metric: "norm"         # currently supported: "norm"
  force_start: 5.0             # N (start adding damping)
  force_stop: 60.0             # N (reach max extra damping)
  # Optional: if provided, ANGULAR extra damping is scheduled by slave torque norm (Nm).
  # If omitted, angular follows the same schedule as linear (force-based).
  torque_metric: "norm"        # currently supported: "norm"
  torque_start: 0.4            # Nm (start adding angular damping)
  torque_stop: 3.0            # Nm (reach max extra angular damping)
  #extra_damping_linear: 500.0   # N*s/m (max extra added to base damping_linear)
  extra_damping_linear: 50.0   # N*s/m (max extra added to base damping_linear)
  extra_damping_angular: 8.0   # N*m*s/rad (optional)
  d_extra_lowpass_cutoff_hz: 20.0  # low-pass on D_extra (<=0 disables)

## ----------------------------
## Dynamic mass (scheduled by slave force)
## ----------------------------
# Increase the master virtual inertia smoothly as the SLAVE measured force grows.
dynamic_mass:
  enabled: false
  use_slave_wrench: true
  force_metric: "norm"           # currently supported: "norm"
  force_start: 5.0               # N
  force_stop: 80.0               # N
  # Optional: if provided, ANGULAR extra mass is scheduled by slave torque norm (Nm).
  # If omitted, angular follows the same schedule as linear (force-based).
  torque_metric: "norm"          # currently supported: "norm"
  torque_start: 0.4              # Nm (start adding angular inertia)
  torque_stop: 3.0              # Nm (reach max extra angular inertia)
  #extra_mass_linear: 15.0         # kg (max extra added to base mass_linear)
  extra_mass_linear: 18.0         # kg (max extra added to base mass_linear)
  extra_mass_angular: 0.3        # kg*m^2 (optional)
  m_extra_lowpass_cutoff_hz: 0.0  # low-pass on M_extra (<=0 disables)
#
# **force_reflection_scale / torque_reflection_scale**:
# scales the fed-back wrench contribution (if slave_wrench_topic is enabled).
# NOTE: with virtual spring coupling active, keep this low (0.01–0.05).
# The spring provides the primary position-based feedback; FT adds subtle contact texture.
#force_reflection_scale: 0.25
force_reflection_scale: 0.50
#torque_reflection_scale: 0.10
torque_reflection_scale: 0.15
#
# **use_forces / use_torques**: enable linear / angular wrench components.
use_forces: false
use_torques: true

## ----------------------------
## Wrench filtering
## ----------------------------
# The node supports low-pass filtering either via:
# - **wrench_filter_alpha** (simple 1st-order IIR, 0..1; smaller = more smoothing), or
# - **wrench_filter_cutoff_hz** (preferred; if >0 it overrides alpha internally).
wrench_filter_cutoff_hz: 30.0
wrench_filter_alpha: 0.5

# Optional: per-signal overrides (MASTER local wrench vs SLAVE feedback wrench).
# If left at the sentinel values below, the node falls back to `wrench_filter_*` above:
# - `*_wrench_filter_cutoff_hz` <= 0.0  -> fallback to `wrench_filter_cutoff_hz`
# - `*_wrench_filter_alpha`     <  0.0  -> fallback to `wrench_filter_alpha`
master_wrench_filter_cutoff_hz: 12.0
feedback_wrench_filter_cutoff_hz: 12.0

## ----------------------------
## Deadbands, clamps, and debug of filtered wrench
## ----------------------------
# Deadband is applied on the wrench norm (soft), with optional hysteresis:
# - enter: threshold to start "considering" force/torque
# - exit: lower threshold to go back to zero (avoids chattering)
force_deadband_enter: 1.5     # N
force_deadband_exit: 1.0      # N
torque_deadband_enter: 0.18    # Nm
torque_deadband_exit: 0.14    # Nm
#
# Saturation limits applied to the wrench norm (safety + robustness).
max_force: 150.0               # N
max_torque: 30.0              # Nm
#
# If true, publish filtered wrench topics for inspection.
publish_filtered_wrench_debug: true
filtered_master_wrench_topic: /teleop_debug/mur620b_UR10_l/master_wrench_filtered
filtered_slave_wrench_topic: /teleop_debug/mur620b_UR10_l/slave_wrench_filtered
#filtered_coupling_wrench_topic: /teleop_debug/mur620b_UR10_l/coupling_wrench_filtered

## ----------------------------
## Command saturation (safety)
## ----------------------------
# Saturate commanded twist norm.
max_linear_speed: 0.7     # m/s
max_angular_speed: 1.8    # rad/s

## ----------------------------
## dt sanitization (real-time robustness)
## ----------------------------
# The node measures dt from ROS timers, then clamps it to avoid unstable spikes.
# **dt_min_factor / dt_max_factor** are multiplicative bounds relative to nominal dt (1/control_rate).
dt_min_factor: 0.5
dt_max_factor: 2.0
#
# If enabled, large dt are split into smaller internal steps (improves stability when CPU jitters).
dt_use_substepping: true
dt_max_substeps: 10

## ----------------------------
## Smoothness limits (optional jerk-limited shaping)
## ----------------------------
# If >0, limit acceleration/jerk (helps avoid sharp user sensations and robot shocks).
max_linear_accel: 1.8      # m/s^2
max_linear_jerk: 40.0       # m/s^3
max_angular_accel: 3.0     # rad/s^2
max_angular_jerk: 30.0     # rad/s^3

# Optional per-axis admittance (uncomment to use)
#mass_linear_xyz: [4.0, 4.0, 6.0]
#damping_linear_xyz: [45.0, 45.0, 70.0]
#mass_angular_xyz: [0.35, 0.35, 0.35]
#damping_angular_xyz: [3.5, 3.5, 3.5]

## ----------------------------
## Safety on stale data
## ----------------------------
# If no wrench arrives for this duration, treat it as stale.
wrench_timeout_s: 0.2     # s
#
# If true, reset internal state when stale (avoids drifting / integrating garbage).
reset_on_stale: true

## ----------------------------
## Diagnostics / debug topics (~debug/*)
## ----------------------------
publish_diagnostics: true
diagnostics_rate: 100.0   # Hz

## ----------------------------
## Publishing targets for the slave (pose + feedforward twist)
## ----------------------------
# If true, the master publishes:
# - a target pose (PoseStamped) and
# - an optional feedforward twist (TwistStamped)
# that the slave outer-loop consumes.
publish_slave_targets: true
#
# Frames used to compute/publish the pose:
# - **slave_base_frame**: frame in which the pose is expressed (common base frame).
# - **slave_tcp_frame**: TCP frame whose pose is published (often the MASTER TCP when teleoperating).
# In `master_slave_mur620b_real.launch` these are intentionally overridden to publish
# the MASTER TCP pose expressed in a common base frame.
slave_base_frame: mur620b/UR10_r/base_link_inertia
slave_tcp_frame: mur620b/UR10_r/tool0
#
# Optional: force the outgoing PoseStamped.header.frame_id (empty = use slave_base_frame).
# slave_frame_id_override: ""
#
# Publishing rate for the slave targets (Hz).
slave_publish_rate: 250.0

## ----------------------------
## Virtual spring coupling (position-based feedback from slave)
## ----------------------------
# Subscribes to the slave's actual TCP pose and computes:
#   F_spring = K_s * (p_master - p_slave) + B_s * (v_master - v_slave)
# This provides stable, delay-insensitive force feedback to the operator.
# Requires the slave to publish its actual pose (publish_master_feedback: true on slave).
spring_stiffness_linear: 10.0    # N/m
spring_damping_linear: 0.0       # N·s/m
spring_stiffness_angular: 0.4    # N·m/rad (disabled: set >0 to enable)
spring_damping_angular: 0.0
max_spring_force: 150.0           # N (safety saturation on spring force norm)
max_spring_torque: 30.0           # N·m
# Topic on which the slave publishes its actual TCP pose (set in launch).
slave_actual_pose_topic: ""

