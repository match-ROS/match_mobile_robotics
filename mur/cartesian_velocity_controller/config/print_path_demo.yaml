# Simple polyline path for the TCP trajectory manager.
#
# Coordinates are expressed in frame_id. For first tests this can be "map",
# "odom", or a static print frame published relative to map.
frame_id: "map"
speed: 0.03

# Configure this for the mounted tool. The default keeps the TCP orientation
# equal to the path frame orientation.
orientation_rpy: [0.0, 0.0, 0.0]

points:
  - [0.40, 0.00, 0.85]
  - [0.60, 0.00, 0.85]
  - [0.60, 0.20, 0.85]
  - [0.40, 0.20, 0.85]
  - [0.40, 0.00, 0.85]
